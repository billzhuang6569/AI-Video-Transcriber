services:
  ai-video-transcriber:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 可选：摘要/翻译 API 密钥（也可在页面 AI Settings 中填写）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # 可选：摘要/翻译 API 端点
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # 可选：转写渠道 openai / openrouter / elevenlabs
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-openai}
      # 可选：OpenAI/OpenRouter 转写 Key 与模型；ElevenLabs 使用 ELEVENLABS_API_KEY
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_TRANSCRIPTION_API_KEY=${OPENAI_TRANSCRIPTION_API_KEY:-}
      - OPENAI_TRANSCRIPTION_BASE_URL=${OPENAI_TRANSCRIPTION_BASE_URL:-}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      # 可选：转写 API 单次上传安全上限（MB）
      - OPENAI_TRANSCRIPTION_MAX_MB=${OPENAI_TRANSCRIPTION_MAX_MB:-24}
      # 可选：本地上传单文件大小上限（MB），与本地环境变量一致
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-200}
      # 可选：登录态 Cookie 文件需通过 volumes 挂载到容器内
      - YTDLP_COOKIE_FILE=${YTDLP_COOKIE_FILE:-}
      # YouTube 新版播放器解析所需，镜像已内置 Node.js
      - YTDLP_JS_RUNTIME=${YTDLP_JS_RUNTIME:-node}
      # 抖音页面/分享链接通过 TikHub 解析为可下载媒体直链
      - TIKHUB_API_TOKEN=${TIKHUB_API_TOKEN:-}
      - TIKHUB_BASE_URL=${TIKHUB_BASE_URL:-https://api.tikhub.io}
      - TIKHUB_REGION=${TIKHUB_REGION:-CN}
      - TIKHUB_TIMEOUT_SECONDS=${TIKHUB_TIMEOUT_SECONDS:-120}
      # 服务器配置
      - HOST=0.0.0.0
      - PORT=8000
    # volumes:
      # 挂载临时文件目录，便于查看和管理下载的文件  
      # - ./temp:/app/temp
      # Cookie 文件不要复制进镜像；按只读方式挂载，并将 YTDLP_COOKIE_FILE 指向容器内路径
      # - ./secrets/cookies.txt:/run/secrets/yt-dlp-cookies.txt:ro
    restart: unless-stopped
    
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
